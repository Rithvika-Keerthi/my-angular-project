<header class="app-header relative bg-dark shadow-lg py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="logo">
        <a routerLink="/" class="text-white fw-bold text-decoration-none">Smart Hotel Booking</a>
      </div>
      <nav class="main-nav">
        <ul class="list-unstyled d-flex mb-0">
          <li><a (click)="navigateToHome()" class="text-white px-3">Home</a></li>
  
          <!-- User Authentication Section -->
          <li *ngIf="isLoggedIn"> 
            <div class="dropdown">
              <button class="dropbtn">
                <img src="https://tse2.mm.bing.net/th/id/OIP.Zvs5IHgOO5kip7A32UwZJgHaHa?rs=1&pid=ImgDetMain" alt="Profile">
              </button>
              <div class="dropdown-content bg-light shadow">
                <!-- <a routerLink="/profile">Profile Overview</a> -->
                <a routerLink="/profile/my-info">My Info</a>
                <a (click)="navigateToRecentBookings()">Recent Bookings</a>
                <a routerLink="/profile/edit-profile">Edit Profile</a>
                <a href="#" (click)="logout()">Logout</a>
              </div>
            </div>
          </li>
  
          <li *ngIf="!isLoggedIn"> 
            <a (click)="navigateToLogin()" class="btn btn-primary">Login</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>
